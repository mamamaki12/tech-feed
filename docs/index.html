<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="日本語のITニュースと技術記事をひとつに。登録不要のTech Feed。"><meta name="theme-color" content="#23332c"><link rel="icon" href="favicon.ico" sizes="32x32"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="site.webmanifest"><title>Tech Feed — ひと息で、テックを。</title><script>try{const t=JSON.parse(localStorage.getItem('tech-feed-v1'))?.theme;document.documentElement.dataset.theme=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}catch{}</script><link rel="stylesheet" href="style.css?v=20"><script type="module" src="app.js?v=21"></script></head>
<body><header><a class="brand" href="./">tech<span>feed</span><i>●</i></a><button id="settings">配信元・設定</button></header>
<main><section class="intro"><p class="eyebrow">YOUR DAILY TECH BREAK</p><h1>ひと息で、テックを。</h1><p>ニュースも、技術記事も。気になる話題をひとつの流れで。</p><small id="status" role="status">記事を読み込み中…</small></section>
<section class="controls" aria-label="記事の絞り込み"><input id="search" type="search" placeholder="気になるキーワードで探す" aria-label="記事を検索"><div class="filters"><select id="topic" aria-label="分野"><option value="">すべての分野</option><option>AI・生成AI</option><option>Web・開発</option><option>セキュリティ</option><option>クラウド・インフラ</option><option>ガジェット</option></select><select id="period" aria-label="期間"><option value="30">過去30日</option><option value="1">過去24時間</option><option value="3">過去3日</option><option value="7">過去1週間</option></select><select id="sort" aria-label="並び順"><option value="recommended">おすすめ順</option><option value="newest">新着順</option></select><select id="view" aria-label="表示対象"><option value="all">すべての記事</option><option value="saved">あとで読む</option><option value="liked">ハートを付けた記事</option></select><label><input type="checkbox" id="unread">既読を隠す</label></div></section>
<div class="list-heading"><h2>新しい発見</h2><span id="count"></span></div><section id="articles" aria-label="記事一覧"></section><button id="more" hidden>もっと見る</button>
<footer>記事は配信元サイトで開きます。無料で全文読めるかは未確認です。<br>有料だった記事や配信元は非表示にできます。設定はこのブラウザだけに保存されます。</footer></main>
<dialog id="dialog"><div class="dialog-head"><h2>配信元・設定</h2><button id="close">閉じる</button></div><p id="interests"></p><div id="display" class="display"></div><p>除外した配信元はチェックを戻すと再表示されます。</p><div id="sources"></div><label class="exclude">除外キーワード（カンマ区切り）<input id="excluded" placeholder="例：PR, セール"></label><p id="storage"></p><button id="reset">保存した設定をリセット</button></dialog><dialog id="reader" class="reader" aria-labelledby="reader-title"><div class="reader-bar"><button id="reader-close" class="reader-back" aria-label="一覧に戻る" title="一覧に戻る">←</button><button id="reader-style" class="reader-style" aria-label="記事の見た目とダークモード" title="記事の見た目とダークモード">Aa</button><a id="reader-original" rel="noopener noreferrer">元の記事を開く ↗</a></div><article tabindex="-1" autofocus><p id="reader-meta" class="reader-meta"></p><h1 id="reader-title"></h1><p id="reader-time" class="reader-time"></p><nav id="reader-toc" class="reader-toc" aria-label="目次"></nav><div id="reader-content"></div><p class="reader-note">広告などを除いた本文を、先に保存しておいたものから表示しています。図や表が欠けることがあります。</p></article></dialog><dialog id="display-dialog"><div class="dialog-head"><h2>表示</h2><button id="display-close">閉じる</button></div><div id="display-quick" class="display"></div></dialog><div id="pull" aria-hidden="true"></div><div id="toast" role="status"></div></body></html>
