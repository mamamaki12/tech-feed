<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="日本語のITニュースと技術記事をひとつに。登録不要のTech Feed。"><title>Tech Feed — ひと息で、テックを。</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><header><a class="brand" href="./">tech<span>feed</span><i>●</i></a><button id="settings">配信元・設定</button></header>
<main><section class="intro"><p class="eyebrow">YOUR DAILY TECH BREAK</p><h1>ひと息で、テックを。</h1><p>ニュースも、技術記事も。気になる話題をひとつの流れで。</p><small id="status" role="status">記事を読み込み中…</small></section>
<section class="controls" aria-label="記事の絞り込み"><input id="search" type="search" placeholder="気になるキーワードで探す" aria-label="記事を検索"><div class="filters"><select id="topic" aria-label="分野"><option value="">すべての分野</option>AI・生成AI</option><option>Web・開発</option><option>セキュリティ</option><option>クラウド・インフラ</option><option>ガジェット</option></select><select id="period" aria-label="期間"><option value="30">過去30日</option><option value="1">過去24時間</option><option value="3">過去3日</option><option value="7">過去1週間</option></select><select id="view" aria-label="表示対象"><option value="all">すべての記事</option><option value="saved">あとで読む</option></select><label><input type="checkbox" id="unread">既読を隠す</label></div></section>
<div class="list-heading"><h2>新しい発見</h2><span id="count"></span></div><section id="articles" aria-label="記事一覧"></section><button id="more" hidden>もっと見る</button>
<footer>記事は配信元サイトで開きます。無料で全文読めるかは未確認です。<br>有料だった記事や配信元は非表示にできます。設定はこのブラウザだけに保存されます。</footer></main>
<dialog id="dialog"><div class="dialog-head"><h2>配信元・設定</h2><button id="close">閉じる</button></div><p>除外した配信元はチェックを戻すと再表示されます。</p><div id="sources"></div><label class="exclude">除外キーワード（カンマ区切り）<input id="excluded" placeholder="例：PR, セール"></label><p id="storage"></p><button id="reset">保存した設定をリセット</button></dialog><div id="toast" role="status"></div></body></html>
