name: Deploy reader worker
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
# 公開に使うのは Cloudflare の秘密の値だけ。リポジトリへの書き込み権限は渡さない。
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Cloudflare の設定（リポジトリの Secrets）がまだなら何もしない。
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo 'CLOUDFLARE_API_TOKEN が未設定のため公開をスキップしました'
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: npm ci && npx wrangler deploy
